# Skill tree for nestjs-authz — flat, all under the primary package.
library: "@dudousxd/nestjs-authz"
structure: flat
router: false   # <=5 peer skills, non-hierarchical

skills:
  - name: authz-setup
    package: "@dudousxd/nestjs-authz"
    path: packages/core/skills/authz-setup/SKILL.md
    type: core
    summary: Install next to the official AuthorizationModule; AuthzModule.forRoot/forRootAsync; deny-by-default; the ambient Gate user (AuthenticationContext, then nestjs-context + resolveUser).

  - name: authz-policies
    package: "@dudousxd/nestjs-authz"
    path: packages/core/skills/authz-policies/SKILL.md
    type: core
    summary: "Official @Policy() classes, @PolicyFor link, AuthzPolicy/superAdmin, scope(); migrating the 0.8 @Policy(Resource)."

  - name: authz-enforcement
    package: "@dudousxd/nestjs-authz"
    path: packages/core/skills/authz-enforcement/SKILL.md
    type: core
    summary: "Official @Can with byId/roles/permission/ability/staticCanArgs, @Roles/@Permission sugar, Gate API, migrating the string @Can."

  - name: authz-query-scopes
    package: "@dudousxd/nestjs-authz"
    path: packages/core/skills/authz-query-scopes/SKILL.md
    type: core
    summary: gate.scope + ScopeConstraint AST builders, policy scope method, adapter applyScope.

  - name: authz-rbac-seams
    package: "@dudousxd/nestjs-authz"
    path: packages/core/skills/authz-rbac-seams/SKILL.md
    type: core
    summary: PERMISSION_PROVIDER / ROLE_PROVIDER seams behind RolePolicy / PermissionPolicy, wildcard permissions, persisted AuthzRbacModule wiring.
